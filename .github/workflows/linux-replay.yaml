# Temporary reduction of the retained release wheel; no native rebuild.
name: Diagnose retained Linux wheel

on:
  workflow_dispatch:
    inputs:
      diagnostic_run:
        description: Linux startup run retaining the original wheel and source receipt
        type: string
        default: "37417950081"
        required: true

permissions: {}

jobs:
  diagnose:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: linux-startup-*
          merge-multiple: true
          path: retained
          run-id: ${{ inputs.diagnostic_run }}
          github-token: ${{ github.token }}

      - name: Resolve the retained wheel's exact source
        id: source
        run: |
          revision=$(jq -r .head_sha retained/diagnostic/source-run.json)
          [[ "$revision" =~ ^[0-9a-f]{40}$ ]]
          [[ $(jq -r .head_repository.full_name retained/diagnostic/source-run.json) == "$GITHUB_REPOSITORY" ]]
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
          sha256sum retained/retained-wheels/*.whl

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.source.outputs.revision }}
          path: source
          persist-credentials: false

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Reduce the draw and sample its generated instructions
        run: |
          mkdir -p diagnostic
          lscpu > diagnostic/cpu.txt
          docker run --rm --cap-add=SYS_PTRACE --security-opt=seccomp=unconfined \
            -v "$GITHUB_WORKSPACE:/work" -v "$(command -v uv):/usr/local/bin/uv:ro" \
            -w /work quay.io/pypa/manylinux_2_28_x86_64@sha256:53390351aeb4688114b02c36a23b3e6ce1166ee9b7afc5df1a4f776354fc764c \
            bash -e -o pipefail -c '
              dnf -q -y install gdb
              uv venv --python /opt/python/cp313-cp313/bin/python /tmp/probe
              uv pip install --python /tmp/probe/bin/python /work/retained/retained-wheels/*.whl /work/source/fonts/manimgx-fonts /work/source/fonts/manimgx-fonts-cjk
              result=0
              for variant in baseline commands symbols perf nopt vector128 no-cache; do
                set -- LVP_CMD_DEBUG=1
                case "$variant" in
                  baseline) set -- ;;
                  symbols) set -- "$@" GALLIVM_DEBUG=symbols ;;
                  perf) set -- "$@" GALLIVM_DEBUG=perf ;;
                  nopt) set -- "$@" GALLIVM_PERF=nopt ;;
                  vector128) set -- "$@" LP_NATIVE_VECTOR_WIDTH=128 ;;
                  no-cache) set -- "$@" MESA_SHADER_CACHE_DISABLE=true ;;
                esac
                mkdir -p "diagnostic/$variant/cache"
                env MESA_SHADER_CACHE_DIR="/work/diagnostic/$variant/cache" "$@" \
                  /tmp/probe/bin/python scripts/release/linux_startup.py "diagnostic/$variant" source --case square --timeout 60 || result=1
                rm -rf "diagnostic/$variant/cache"
              done
              exit "$result"
            ' 2>&1 | tee diagnostic/probe.log

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: linux-retained-${{ inputs.diagnostic_run }}
          path: diagnostic/
          retention-days: 7
          if-no-files-found: error
