# Reuse a Test run's wheel and exact source to expose the first Windows failure.
# This dispatch is diagnostic only; it does not replace the full platform matrix.
name: Diagnose Windows tests

on:
  workflow_dispatch:
    inputs:
      wheel_run:
        description: Test run whose Windows wheel and source to investigate
        type: string
        required: true
      testargs:
        description: Arguments passed directly to pytest
        type: string
        default: --ignore=tests/integration/test_corpus.py -n 0 -x -vv -s --randomly-seed=2385582541

permissions: {}

jobs:
  diagnose:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-2025
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
    defaults:
      run:
        shell: bash
    env:
      UV_NO_SYNC: "1"
      PYTHONFAULTHANDLER: "1"
      PYTHONUNBUFFERED: "1"
      RUST_BACKTRACE: "1"
    steps:
      - name: Resolve the wheel's source revision
        id: source
        run: |
          [[ "$WHEEL_RUN" =~ ^[0-9]+$ ]]
          revision=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$WHEEL_RUN" --jq .head_sha)
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
          echo "Testing wheel from run $WHEEL_RUN at $revision"
        env:
          GH_TOKEN: ${{ github.token }}
          WHEEL_RUN: ${{ inputs.wheel_run }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.source.outputs.revision }}
          persist-credentials: false

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.13"

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: wheel-windows-2025
          path: dist
          run-id: ${{ inputs.wheel_run }}
          github-token: ${{ github.token }}

      - name: Install the wheel and its test dependencies
        run: |
          uv sync --frozen --no-install-project
          uv pip install --no-deps dist/*.whl

      - name: Stop at the first failure with its full traceback
        run: |
          uv run --frozen python - <<'PY' 2>&1 | tee windows-diagnostic.log
          import os
          import shlex
          import subprocess
          import sys

          command = [sys.executable, "-m", "pytest", "--junitxml=windows-diagnostic.xml"]
          command += shlex.split(os.environ["TEST_ARGS"])
          print(command, flush=True)
          raise SystemExit(subprocess.call(command))
          PY
        env:
          TEST_ARGS: ${{ inputs.testargs }}

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: windows-diagnostic-${{ inputs.wheel_run }}
          path: |
            windows-diagnostic.log
            windows-diagnostic.xml
          retention-days: 7
