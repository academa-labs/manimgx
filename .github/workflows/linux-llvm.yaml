# Temporary compiler-only reduction; it never executes the generated shader.
name: Diagnose retained LLVM shader

on:
  workflow_dispatch:
    inputs:
      mesa_run:
        description: Mesa diagnostic run retaining the proven failing optimized bitcode
        type: string
        default: "37425715254"
        required: true
      experiment:
        description: Capture, reduce, or test the generic rematerialization fix
        type: choice
        options: [capture, repair, reduce]
        default: capture
        required: true

permissions: {}

jobs:
  diagnose:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: linux-mesa-37417950081-4
          path: retained
          run-id: ${{ inputs.mesa_run }}
          github-token: ${{ github.token }}

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: inputs.experiment == 'reduce'
        with:
          name: linux-llvm-37425715254
          path: checkpoint
          run-id: 37432921750
          github-token: ${{ github.token }}

      - name: Verify and lower the exact captured LLVM program
        env:
          EXPERIMENT: ${{ inputs.experiment }}
        run: |
          mkdir -p diagnostic
          git rev-parse HEAD > diagnostic/diagnostic-revision.txt
          script=scripts/release/linux_llvm.sh
          if [[ "$EXPERIMENT" == repair ]]; then script=scripts/release/linux_llvm_repair.sh; fi
          if [[ "$EXPERIMENT" == reduce ]]; then script=scripts/release/linux_llvm_reduce.sh; fi
          docker run --rm -v "$GITHUB_WORKSPACE:/work" -w /work \
            quay.io/pypa/manylinux_2_28_x86_64@sha256:53390351aeb4688114b02c36a23b3e6ce1166ee9b7afc5df1a4f776354fc764c \
            bash "$script" retained diagnostic checkpoint 2>&1 | tee diagnostic/commands.log

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: linux-llvm-${{ inputs.mesa_run }}
          path: diagnostic/
          retention-days: 7
          if-no-files-found: error
