# An explicit experiment: reviewed takes and a frozen native interpreter, on the candidate's
# own GPU and driver. This does not replace the corpus's acceptance rules or publish assets.
name: Frozen renderer experiment

on:
  workflow_dispatch:
    inputs:
      baseline_run:
        description: Test run containing the reviewed wheel artifacts
        required: true
        type: string
      candidate_run:
        description: Test run containing candidate wheels (empty uses baseline)
        required: false
        type: string
      release_asset:
        description: Numeric asset ID of the existing reviewed take bundle
        required: true
        type: string
      reference_sha256:
        description: Independently verified SHA256 of the take bundle
        required: true
        default: cec112a68c80bc9c201980fe08f9908a190f661983b018aaec9729ba6954e987
        type: string
      platforms:
        description: JSON list of hosted runners to compare
        required: true
        default: '["ubuntu-24.04", "macos-26", "windows-2025"]'
        type: string
      cases:
        description: Space-separated case names (empty compares the entire corpus)
        required: false
        type: string
      capture_take:
        description: Also record each selected scene for numerical input diagnosis
        required: false
        default: false
        type: boolean

permissions: {}

jobs:
  references:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Draft assets require push access. This bootstrap only downloads a verified asset;
    # the matrix receives an ordinary Actions artifact and has no write permission.
    permissions:
      contents: write
    steps:
      - name: Download and verify the existing reference capture
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/releases/assets/${ASSET_ID}" \
            --header 'Accept: application/octet-stream' > reference.tar.gz
          python - <<'PY'
          import hashlib, os, tarfile
          from pathlib import Path
          path = Path("reference.tar.gz")
          with path.open("rb") as stream:
              actual = hashlib.file_digest(stream, "sha256").hexdigest()
          if actual != os.environ["REFERENCE_SHA256"]:
              raise SystemExit(f"reference bundle SHA256 differs: {actual}")
          with tarfile.open(path) as archive:
              archive.extractall("references", filter="data")
          PY
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET_ID: ${{ inputs.release_asset }}
          REFERENCE_SHA256: ${{ inputs.reference_sha256 }}

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frozen-reference-capture
          path: references/
          if-no-files-found: error
          retention-days: 7

  compare:
    needs: references
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.platforms) }}
    permissions:
      contents: read
      actions: read
    defaults:
      run:
        shell: bash
    env:
      UV_NO_SYNC: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.13"

      - name: Install the Linux GPU driver
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libvulkan1 mesa-vulkan-drivers

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: frozen-reference-capture
          path: references

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: wheel-${{ matrix.os }}
          path: baseline
          run-id: ${{ inputs.baseline_run }}
          github-token: ${{ github.token }}

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: wheel-${{ matrix.os }}
          path: candidate
          run-id: ${{ inputs.candidate_run || inputs.baseline_run }}
          github-token: ${{ github.token }}

      - name: Install the candidate artifact and test dependencies
        run: |
          uv sync --frozen --no-install-project
          uv pip install --no-deps candidate/*.whl

      - name: Prove source differences are detected
        run: |
          wheel=(baseline/*.whl)
          sha="$(uv run --frozen --no-sync python -c 'import hashlib,sys; print(hashlib.file_digest(open(sys.argv[1], "rb"), "sha256").hexdigest())' "${wheel[0]}")"
          uv run --frozen --no-sync python -m tests.integration.corpus.frozen_probe \
            negative-source basic_usage --negative-source \
            --wheel "${wheel[0]}" --sha256 "${sha}" --references references

      - name: Compare every scene on the same adapter
        run: |
          wheel=(baseline/*.whl)
          read -r -a cases <<< "$CASE_NAMES"
          options=()
          if [[ "$CAPTURE_TAKE" == true ]]; then options+=(--capture-take); fi
          sha="$(uv run --frozen --no-sync python -c 'import hashlib,sys; print(hashlib.file_digest(open(sys.argv[1], "rb"), "sha256").hexdigest())' "${wheel[0]}")"
          uv run --frozen --no-sync python -m tests.integration.corpus.frozen_probe \
            frozen-comparison "${cases[@]}" "${options[@]}" --wheel "${wheel[0]}" --sha256 "${sha}" --references references
        env:
          CASE_NAMES: ${{ inputs.cases }}
          CAPTURE_TAKE: ${{ inputs.capture_take }}

      - name: Compare locally recorded inputs with direct rendering
        if: ${{ !cancelled() && inputs.capture_take }}
        run: |
          wheel=(baseline/*.whl)
          read -r -a cases <<< "$CASE_NAMES"
          sha="$(uv run --frozen --no-sync python -c 'import hashlib,sys; print(hashlib.file_digest(open(sys.argv[1], "rb"), "sha256").hexdigest())' "${wheel[0]}")"
          uv run --frozen --no-sync python -m tests.integration.corpus.frozen_probe \
            local-input-comparison "${cases[@]}" --wheel "${wheel[0]}" --sha256 "${sha}" \
            --references frozen-comparison
        env:
          CASE_NAMES: ${{ inputs.cases }}

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: frozen-comparison-${{ matrix.os }}
          path: |
            frozen-comparison/
            !frozen-comparison/reference-wheel/**
            negative-source/
            !negative-source/reference-wheel/**
            local-input-comparison/
            !local-input-comparison/reference-wheel/**
          if-no-files-found: error
          retention-days: 7
