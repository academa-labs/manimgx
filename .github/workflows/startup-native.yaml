# Measure the ordinary product wheel: cold processes remain part of the contract.
name: Native startup experiment

on:
  workflow_dispatch:

permissions: {}

jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 60
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.13"

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: rust
          shared-key: engine
          save-if: false

      - name: Build and install the production wheel
        run: |
          uv build --wheel --python 3.13 --out-dir dist
          uv sync --frozen --no-install-project
          uv pip install --no-deps dist/*.whl

      - name: Measure cold and warm scenes
        env:
          UV_NO_SYNC: "1"
        run: uv run --frozen --no-sync python -m tests.integration.corpus.startup_probe startup-production --fresh 2>&1 | tee startup-production.log

      - name: Measure the full Clifford CLI and its first draws
        env:
          UV_NO_SYNC: "1"
        run: |
          uv run --frozen --no-sync python - <<'PYTHON'
          import json
          import subprocess
          import sys
          import time
          from pathlib import Path

          output = Path("startup-clifford").resolve()
          output.mkdir()
          scene = Path("examples/clifford_torus.py").resolve()
          timings = {}
          failures = []
          programs = {
              "cli": ["-m", "manimgx", "render", str(scene), "--resolution", "64x36", "--fps", "5", "--output", str(output / "video.mp4")],
              "authoring": ["-c", """
          import json, sys, time
          from pathlib import Path
          import manimgx as m
          from manimgx.cli.scenes import scene
          started = time.perf_counter()
          kind = scene(Path(sys.argv[1]), None)
          m.config.pixel_width, m.config.pixel_height, m.config.frame_rate = 64, 36, 5
          with Path(sys.argv[2]).open('wb') as stream:
              film = kind().render(take=stream.write)
          print(json.dumps({'seconds': time.perf_counter() - started, 'frames': film.frame_count}), flush=True)
          """, str(scene), str(output / "recording.take")],
              "replay": ["-c", """
          import hashlib, json, sys, time
          from pathlib import Path
          from manimgx import _engine
          def measure(name, action):
              started = time.perf_counter()
              result = action()
              print(json.dumps({'phase': name, 'seconds': time.perf_counter() - started}), flush=True)
              return result
          replay = measure('decode', lambda: _engine.Replay(Path(sys.argv[1]).read_bytes()))
          print(json.dumps(measure('device_and_eager_pipelines', _engine.adapter_info)), flush=True)
          for frame in dict.fromkeys([0, replay.frames // 2, replay.frames - 1]):
              first = measure(f'frame_{frame}_first', lambda: replay.render(frame))
              repeat = measure(f'frame_{frame}_repeat', lambda: replay.render(frame))
              assert first == repeat
              print(json.dumps({'frame': frame, 'sha256': hashlib.sha256(first).hexdigest()}), flush=True)
          """, str(output / "recording.take")],
          }
          try:
              for phase, command in programs.items():
                  started = time.perf_counter()
                  with (output / f"{phase}.log").open("wb") as log:
                      try:
                          subprocess.run([sys.executable, *command], stdout=log, stderr=subprocess.STDOUT, timeout=300, check=True)
                      except (subprocess.CalledProcessError, subprocess.TimeoutExpired) as error:
                          failures.append(f"{phase}: {error}")
                      finally:
                          timings[phase] = time.perf_counter() - started
                          print(phase, timings[phase], flush=True)
          finally:
              (output / "timings.json").write_text(json.dumps({"seconds": timings, "failures": failures}, indent=2))
          if failures:
              raise RuntimeError("; ".join(failures))
          PYTHON

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: native-startup-windows
          path: |
            startup-*/
            startup-*.log
            !startup-clifford/recording.take
          if-no-files-found: error
          retention-days: 7
