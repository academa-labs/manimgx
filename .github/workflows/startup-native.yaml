# Measure the ordinary product wheel: cold processes remain part of the contract.
name: Native startup experiment

on:
  workflow_dispatch:
    inputs:
      baseline_run:
        description: Optional Test run whose wheel is compared on this same runner
        required: false
        type: string

permissions: {}

jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.13"

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: rust
          shared-key: engine
          save-if: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: ${{ inputs.baseline_run != '' }}
        with:
          name: wheel-windows-2025
          path: baseline
          run-id: ${{ inputs.baseline_run }}
          github-token: ${{ github.token }}

      - name: Retrieve the baseline source and locked environment
        if: ${{ inputs.baseline_run != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          BASELINE_RUN: ${{ inputs.baseline_run }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${BASELINE_RUN}" > baseline/run.json
          commit="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${BASELINE_RUN}" --jq .head_sha)"
          gh api "repos/${GITHUB_REPOSITORY}/contents/uv.lock?ref=${commit}" \
            --header 'Accept: application/vnd.github.raw+json' > baseline/uv.lock

      - name: Build the ordinary candidate wheel and frozen runtime
        run: |
          uv build --wheel --python 3.13 --out-dir dist
          uv sync --frozen --no-install-project
          uv pip install --no-deps dist/*.whl

      - name: Measure both installed wheels in fresh processes
        env:
          UV_NO_SYNC: "1"
          BASELINE_RUN: ${{ inputs.baseline_run }}
        run: |
          failed=0
          for mode in baseline production; do
            if [[ "$mode" == baseline ]]; then
              [[ -n "$BASELINE_RUN" ]] || continue
              wheel=(baseline/*.whl)
            else
              wheel=(dist/*.whl)
            fi
            uv pip install --force-reinstall --no-deps "${wheel[0]}"
            uv run --frozen --no-sync python - "${wheel[0]}" "$mode" <<'PYTHON'
          import hashlib
          import json
          import os
          import sys
          import zipfile
          from pathlib import Path
          from tests.integration.corpus.frozen import dependencies
          import manimgx
          from manimgx import _engine

          wheel, mode = Path(sys.argv[1]), sys.argv[2]
          package = Path(manimgx.__file__).resolve().parent
          assert Path(_engine.__file__).resolve().parent == package
          with zipfile.ZipFile(wheel) as archive:
              for name in archive.namelist():
                  if name.startswith("manimgx/") and not name.endswith("/"):
                      assert (package.parent / name).read_bytes() == archive.read(name), name
          if mode == "baseline":
              commit = json.loads(Path("baseline/run.json").read_text(encoding="utf-8"))["head_sha"]
              dependencies(Path("baseline/uv.lock"), Path("uv.lock"))
          else:
              commit = os.environ["GITHUB_SHA"]
          Path(f"startup-{mode}-wheel.json").write_text(json.dumps({
              "source": commit, "wheel": wheel.name,
              "sha256": hashlib.sha256(wheel.read_bytes()).hexdigest(),
              "package": str(package),
          }, indent=2), encoding="utf-8")
          PYTHON
            uv run --frozen --no-sync python -m tests.integration.corpus.startup_probe "startup-$mode" --fresh 2>&1 | tee "startup-$mode.log" || failed=1
            uv run --frozen --no-sync python -m tests.integration.corpus.startup_probe "startup-$mode-clifford" --workload examples/clifford_torus.py 2>&1 | tee "startup-$mode-clifford.log" || failed=1
          done
          exit "$failed"

      - name: Verify both product wheels made exactly the same frames
        if: ${{ !cancelled() && inputs.baseline_run != '' }}
        run: |
          uv run --frozen --no-sync python - <<'PYTHON'
          import json
          from pathlib import Path
          baseline = json.loads(Path("startup-baseline/startup.json").read_text(encoding="utf-8"))
          candidate = json.loads(Path("startup-production/startup.json").read_text(encoding="utf-8"))
          assert baseline["adapter"] == candidate["adapter"]
          assert baseline["records"] == candidate["records"]
          print("All five product films agree exactly on the same adapter.")
          PYTHON

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: native-startup-windows
          path: |
            startup-*/
            startup-*.log
            startup-*-wheel.json
            !startup-*/recording.take
          if-no-files-found: error
          retention-days: 7
