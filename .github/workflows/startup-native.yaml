# Temporary first-execution investigation. Instrumentation only enters this manual build;
# its artifact is diagnostic evidence, never a release or reference wheel.
name: Native startup experiment

on:
  workflow_dispatch:

permissions: {}

jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 60
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.13"

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: rust
          shared-key: engine
          save-if: false

      - name: Instrument this disposable build
        run: |
          uv run --no-project --python 3.13 python tests/integration/corpus/instrument_startup.py
          git diff -- rust/engine/src > native-instrumentation.patch

      - name: Build and install the diagnostic wheel
        run: |
          uv build --wheel --python 3.13 --out-dir dist
          uv sync --frozen --no-install-project
          uv pip install --no-deps dist/*.whl

      - name: Measure combined and independent flatten kernels
        env:
          UV_NO_SYNC: "1"
        run: |
          uv run --frozen --no-sync python -m tests.integration.corpus.startup_probe startup-combined --fresh 2>&1 | tee startup-combined.log
          MANIMGX_DIAGNOSTIC_FLATTEN_SPLIT=1 uv run --frozen --no-sync python -m tests.integration.corpus.startup_probe startup-families --fresh 2>&1 | tee startup-families.log
          MANIMGX_DIAGNOSTIC_WEIGHTED=1 uv run --frozen --no-sync python -m tests.integration.corpus.startup_probe startup-weighted --fresh 2>&1 | tee startup-weighted.log
          MANIMGX_DIAGNOSTIC_WEIGHTED=1 MANIMGX_DIAGNOSTIC_FLATTEN_SPLIT=1 uv run --frozen --no-sync python -m tests.integration.corpus.startup_probe startup-weighted-families --fresh 2>&1 | tee startup-weighted-families.log

      - name: Isolate flattening from coverage execution
        env:
          UV_NO_SYNC: "1"
          MANIMGX_DIAGNOSTIC_SPLIT: "1"
        run: |
          uv run --frozen --no-sync python -m tests.integration.corpus.startup_probe startup-split 2>&1 | tee startup-split.log
          MANIMGX_DIAGNOSTIC_FLATTEN_SPLIT=1 uv run --frozen --no-sync python -m tests.integration.corpus.startup_probe startup-families-split 2>&1 | tee startup-families-split.log
          MANIMGX_DIAGNOSTIC_EMPTY_FLATTEN=1 uv run --frozen --no-sync python -m tests.integration.corpus.startup_probe startup-empty-flatten 2>&1 | tee startup-empty-flatten.log
          MANIMGX_DIAGNOSTIC_WEIGHTED=1 uv run --frozen --no-sync python -m tests.integration.corpus.startup_probe startup-weighted-split 2>&1 | tee startup-weighted-split.log
          MANIMGX_DIAGNOSTIC_WEIGHTED=1 MANIMGX_DIAGNOSTIC_FLATTEN_SPLIT=1 uv run --frozen --no-sync python -m tests.integration.corpus.startup_probe startup-weighted-families-split 2>&1 | tee startup-weighted-families-split.log

      - name: Verify instrumentation preserved every scene
        run: |
          uv run --no-project --python 3.13 python - <<'PY'
          import json
          from pathlib import Path
          modes = ["combined", "families", "weighted", "weighted-families", "split", "families-split", "empty-flatten", "weighted-split", "weighted-families-split"]
          runs = [json.loads(Path(f"startup-{mode}/startup.json").read_text()) for mode in modes]
          assert all(run["records"] == runs[0]["records"] for run in runs[1:])
          print("All combined, independent-output and split-pass frames agree exactly.")
          PY

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: native-startup-windows
          path: |
            native-instrumentation.patch
            rust/engine/src/startup_timing.rs
            startup-*/
            startup-*.log
          if-no-files-found: error
          retention-days: 7
