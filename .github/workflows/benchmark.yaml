# The timed benchmarks (`just bench`): a pull request's manimgx against its base's, and each
# push to main against the commit before it, rendered in turns on one Linux runner. A workload
# that became slower fails the job; every workload's change is in the run's summary. Time is
# only compared on one machine at one time, so this is the one job that measures it; the laws
# of cost run with the tests, on every system.

name: Benchmark

on:
  push:
    branches: [main]
    paths:
      - src/**
      - fonts/**
      - rust/**
      - examples/**
      - tests/benchmarks/**
      - pyproject.toml
      - uv.lock
  pull_request:
    paths:
      - src/**
      - fonts/**
      - rust/**
      - examples/**
      - tests/benchmarks/**
      - pyproject.toml
      - uv.lock
  workflow_dispatch:
    inputs:
      against:
        description: The commit, branch or tag to compare with
        required: true
        default: main

permissions: {}

concurrency:
  group: benchmark-${{ github.event.pull_request.number || github.ref }}
  # a newer commit supersedes a pull request's run; main's active run finishes
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  benchmark:
    name: Benchmark against the base
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      # all of history: the commit compared with is made from it
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2.87.21
        with:
          tool: just

      # the GPU the benchmarks draw with, on the CPU: Mesa's lavapipe
      - name: Install a GPU driver
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libvulkan1 mesa-vulkan-drivers

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      # the engine's dependencies, compiled; the base's engine, when built, reuses them too
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: rust
          shared-key: engine
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # a pull request is checked out merged into its base: the merge's first parent is the base
      - name: Benchmark
        run: just bench "${AGAINST}"
        env:
          AGAINST: >-
            ${{ github.event_name == 'pull_request' && 'HEAD^1'
            || github.event_name == 'push' && github.event.before
            || inputs.against }}
