# Temporary cold source-build experiment; produces diagnostic artifacts only.
name: Diagnose complete LLVM source build

on:
  workflow_dispatch:

permissions: {}

jobs:
  diagnose:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: linux-startup-*
          merge-multiple: true
          path: retained
          run-id: 37417950081
          github-token: ${{ github.token }}

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: linux-mesa-37417950081-4
          path: llvm-retained
          run-id: 37425715254
          github-token: ${{ github.token }}

      - name: Resolve the retained wheel's exact source
        id: source
        run: |
          revision=$(jq -r .head_sha retained/diagnostic/source-run.json)
          [[ "$revision" =~ ^[0-9a-f]{40}$ ]]
          [[ $(jq -r .head_repository.full_name retained/diagnostic/source-run.json) == "$GITHUB_REPOSITORY" ]]
          echo "revision=$revision" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.source.outputs.revision }}
          path: source
          persist-credentials: false

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Measure the cold compiler build and verify the resulting driver
        run: |
          mkdir -p diagnostic
          lscpu > diagnostic/cpu.txt
          git rev-parse HEAD > diagnostic/diagnostic-revision.txt
          cp retained/diagnostic/source-run.json diagnostic/
          docker run --rm --cap-add=SYS_PTRACE --security-opt=seccomp=unconfined \
            -v "$GITHUB_WORKSPACE:/work" -v "$(command -v uv):/usr/local/bin/uv:ro" \
            -w /work quay.io/pypa/manylinux_2_28_x86_64@sha256:53390351aeb4688114b02c36a23b3e6ce1166ee9b7afc5df1a4f776354fc764c \
            bash -e -o pipefail -c '
              dnf -q -y install gdb
              uv venv --python /opt/python/cp313-cp313/bin/python /tmp/probe
              uv pip install --python /tmp/probe/bin/python /work/retained/retained-wheels/*.whl /work/source/fonts/manimgx-fonts /work/source/fonts/manimgx-fonts-cjk
              status=0
              /tmp/probe/bin/python scripts/release/linux_startup.py diagnostic/original source --case square --timeout 60 || status=$?
              echo "$status" > diagnostic/original-status.txt
              curl --proto "=https" --tlsv1.2 --silent --show-error --fail https://sh.rustup.rs | sh -s -- -y --profile minimal
              export PATH="$HOME/.cargo/bin:$PATH"
              bash scripts/release/linux_llvm_source.sh llvm-retained source diagnostic
              cp diagnostic/driver/libvulkan_lvp.so /tmp/probe/lib/python3.13/site-packages/manimgx/lavapipe/libvulkan_lvp.so
              readelf -d diagnostic/driver/libvulkan_lvp.so > diagnostic/dynamic-libraries.txt
              result=0
              for case in square line glyph text smoke; do
                mkdir -p "diagnostic/fixed-$case/bitcode"
                MANIMGX_DIAGNOSTIC_DUMP_DIR="/work/diagnostic/fixed-$case/bitcode" \
                  /tmp/probe/bin/python scripts/release/linux_startup.py "diagnostic/fixed-$case" source --case "$case" --timeout 60 || result=1
              done
              printf "%s\n" "f39b6104c7bffb4bc8cdd11924a35e24f5b68a4335390d8fd608bbcf026c79ed  diagnostic/fixed-square/first.rgba" | sha256sum --check || result=1
              sha256sum diagnostic/fixed-*/bitcode/*.bc > diagnostic/fixed-bitcode-hashes.txt
              exit "$result"
            ' 2>&1 | tee diagnostic/commands.log

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: linux-source-llvm-${{ github.run_id }}
          path: diagnostic/
          retention-days: 7
          if-no-files-found: error
