[package]
name = "manimgx-metal"
version = "0.1.0"
edition = "2021"

[dependencies]
log = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
manimgx-core = { path = "../manimgx-core" }
manimgx-encode = { path = "../manimgx-encode" }
metal = "0.31"
objc = "0.2"
bytemuck = { workspace = true }
glam = { workspace = true }

[features]
time_profile = []

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("time_profile", "cargo-clippy"))'] }
