[package]
name = "manimgx_engine"
version = "0.1.0"
edition = "2024"

[lib]
name = "engine"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.28", features = ["extension-module"] }
lyon = "1.0"
usvg = "0.47"
wgpu = "28"
bytemuck = { version = "1", features = ["derive"] }
numpy = "0.28"
pollster = "0.4"
[target.'cfg(target_os = "macos")'.dependencies]
metal = "0.33"

[profile.dev]
opt-level = 2
